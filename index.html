<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="TickDone: to-do lists, calendar, priority matrix, focus timer and habit tracker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TickDone" />
    <meta name="format-detection" content="telephone=no" />
    <title>TickDone</title>
    <script>
      // Apply the saved theme before the first paint so the launch screen matches the app.
      try {
        var d = JSON.parse(localStorage.getItem('tickdone:data:v1') || 'null')
        if (d && d.settings && d.settings.theme === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
    <style>
      #launch {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fff;
        pointer-events: none;
        transition: opacity 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      :root[data-theme='dark'] #launch { background: #1e1e1e; }
      #launch.out { opacity: 0; }
      #launch .mark { width: 88px; height: 88px; animation: launch-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #launch .ring-bg { stroke: #dfe7ff; }
      :root[data-theme='dark'] #launch .ring-bg { stroke: #2c3a66; }
      #launch .ring, #launch .check { stroke-dasharray: 1; stroke-dashoffset: 1; }
      #launch .ring { animation: launch-draw 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards; }
      #launch .check { animation: launch-draw 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) 0.65s forwards; }
      #launch .name {
        font: 600 20px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.02em;
        color: #1f1f1f;
        animation: launch-rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s both;
      }
      :root[data-theme='dark'] #launch .name { color: #e8e8e8; }
      @keyframes launch-pop { from { opacity: 0; transform: scale(0.8); } }
      @keyframes launch-draw { to { stroke-dashoffset: 0; } }
      @keyframes launch-rise { from { opacity: 0; transform: translateY(6px); } }
      @media (prefers-reduced-motion: reduce) {
        #launch, #launch * { animation: none !important; transition: none !important; }
        #launch .ring, #launch .check { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="launch" aria-hidden="true">
      <svg class="mark" viewBox="0 0 512 512">
        <circle class="ring-bg" cx="256" cy="256" r="196" fill="none" stroke-width="44" />
        <path class="ring" pathLength="1" d="M256 60A196 196 0 1 1 79 172" fill="none" stroke="#4772fa" stroke-width="44" stroke-linecap="round" />
        <path class="check" pathLength="1" d="M176 260l56 56 112-124" fill="none" stroke="#4772fa" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="name">TickDone</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
